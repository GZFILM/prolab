<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProLab</title>
<meta name="description" content="ProLab · פירוק תסריט, שוטים, סטוריבורד ולו״ז צילום · by G.Z MOTION LAB">
<meta name="theme-color" content="#0B1828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Rubik:wght@400;500;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css?v=2.9">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="ניווט">
    <a class="mark" href="#home" aria-label="ProLab, בית" id="railmark"></a>
    <button data-act="menu" class="rail-menu" aria-label="תפריט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>תפריט</span></button>
    <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>בית</span></button>
    <button data-view="script"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg><span>תסריט</span></button>
    <button data-view="shots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg><span>שוטים</span></button>
    <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>לו"ז</span></button>
    <button data-view="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8l16-4v4H4z"/><rect x="4" y="8" width="16" height="12" rx="1"/></svg><span>סט</span></button>
    <button data-view="cut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5L20 18M8.5 16.5L20 6"/></svg><span>עריכה</span></button>
    <button data-view="settings" class="rail-set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>הגדרות</span></button>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="status" id="status" hidden><span class="spin" id="spin"></span><span id="stxt"></span><button class="btn sm2" id="bStop">עצור</button><button class="btn ghost sm2" id="bStatusX" aria-label="סגור">✕</button></div>
<div class="toast" id="toast" role="status" hidden></div>

<div class="drawerwrap" id="drawerwrap" hidden><nav class="drawer" id="drawer" aria-label="תפריט ראשי"></nav></div>

<div class="overlay" id="sheetwrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="overlay" id="manual" hidden><div class="sheet" role="dialog" aria-labelledby="mTitle">
  <h2 id="mTitle">שלב ידני דרך claude.ai</h2>
  <p class="muted small" id="mLabel"></p>
  <ol class="steps-list"><li>לוחצים "העתק בקשה".</li><li>פותחים שיחה חדשה ב-claude.ai, מדביקים ושולחים.</li><li>מעתיקים את כל התשובה של Claude, מדביקים בתיבה התחתונה ולוחצים "המשך".</li></ol>
  <div class="row"><button class="btn primary" id="mCopy">העתק בקשה</button><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">פתח את claude.ai ↗</a><span class="small muted" id="mCopied"></span></div>
  <textarea id="mPrompt" readonly aria-label="הבקשה ל-Claude"></textarea>
  <label class="lbl" for="mAnswer">התשובה של Claude</label>
  <textarea id="mAnswer" placeholder="הדבק כאן את התשובה (בדרך כלל היא מתחילה ב-{)"></textarea>
  <p class="small err" id="mErr"></p>
  <div class="row"><button class="btn primary" id="mGo">המשך</button><button class="btn" id="mCancel">ביטול</button></div>
</div></div>

<div class="peek" id="peek" hidden></div>
<div class="lightbox" id="lightbox" hidden><figure class="lbfig" id="lbfig"><img id="lbimg" alt="רפרנס"><figcaption id="lbcap">נגיעה בתמונה משאירה אותה פתוחה</figcaption><span class="lbbar" id="lbbar"></span><button class="lbx" id="lbx" aria-label="סגור">✕</button><button class="lbdel" id="lbdel" hidden>🗑 מחק</button></figure></div>
<div id="printview" dir="rtl"></div>
<input type="file" id="fScript" accept=".txt,.md,.fountain,.docx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="vh" tabindex="-1">
<input type="file" id="fCam" accept="image/*" capture="environment" class="vh" tabindex="-1">
<input type="file" id="fGal" accept="image/*" class="vh" tabindex="-1">
<input type="file" id="fJson" accept=".json,application/json" class="vh" tabindex="-1">

<script src="vendor/anthropic-sdk.js" defer></script>
<script src="app.js?v=2.9" defer></script>
</body>
</html>
